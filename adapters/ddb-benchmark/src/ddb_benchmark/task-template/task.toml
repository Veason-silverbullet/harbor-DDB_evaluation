schema_version = "1.4"

[task]
name = "ddb-benchmark/template"
authors = [{ name = "DDB_evaluation contributors" }]

[metadata]
benchmark = "ddb-benchmark"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 14400.0

[verifier.env]
DDB_CUA_API_KEY = "${DDB_CUA_API_KEY}"
DDB_CUA_BASE_URL = "${DDB_CUA_BASE_URL:-https://api.openai.com/v1}"
DDB_CUA_MODEL = "${DDB_CUA_MODEL}"
DDB_CUA_AGENT_PROTOCOL = "${DDB_CUA_AGENT_PROTOCOL:-function_calling}"
DDB_CUA_MAX_ITERATIONS = "${DDB_CUA_MAX_ITERATIONS:-20}"
DDB_JUDGE_API_KEY = "${DDB_JUDGE_API_KEY}"
DDB_JUDGE_BASE_URL = "${DDB_JUDGE_BASE_URL:-https://api.openai.com/v1}"
DDB_JUDGE_MODEL = "${DDB_JUDGE_MODEL}"
DDB_JUDGE_PROVIDER = "${DDB_JUDGE_PROVIDER:-openai}"
DDB_JUDGE_MAX_TOKENS = "${DDB_JUDGE_MAX_TOKENS:-32000}"
DDB_SEARCH_API_KEY = "${DDB_SEARCH_API_KEY:-}"
DDB_SEARCH_PROVIDER = "${DDB_SEARCH_PROVIDER:-tavily}"
DDB_SEARCH_ENDPOINT = "${DDB_SEARCH_ENDPOINT:-}"

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 8192
storage_mb = 16384
